<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="70" viewBox="0 0 260 70" role="img" aria-label="C++ vs Python HTML5 CSS3">
  <title>C++ and Other Languages</title>
  
  <!-- C++ Badge (Scaled up, on the left) -->
  <g transform="translate(0, 0) scale(2.5)">
    <g shape-rendering="crispEdges">
      <rect width="71.75" height="28" fill="#00599c"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="100">
      <image x="9" y="7" width="14" height="14" href="data:image/svg+xml;base64,"/>
      <text transform="scale(.1)" x="458.75" y="175" textLength="277.5" font-weight="bold">C++</text>
    </g>
  </g>

  <!-- Python Badge (Top right) -->
  <g transform="translate(191.375, 0)">
    <g shape-rendering="crispEdges">
      <rect width="67" height="20" fill="#3776ab"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <image x="5" y="3" width="14" height="14" href="data:image/svg+xml;base64,"/>
      <text x="425" y="140" textLength="390" transform="scale(.1)">Python</text>
    </g>
  </g>

  <!-- HTML5 Badge (Middle right) -->
  <g transform="translate(191.375, 25)">
    <g shape-rendering="crispEdges">
      <rect width="65" height="20" fill="#e34f26"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <image x="5" y="3" width="14" height="14" href="data:image/svg+xml;base64,"/>
      <text x="415" y="140" textLength="370" transform="scale(.1)">HTML5</text>
    </g>
  </g>

  <!-- CSS3 Badge (Bottom right) -->
  <g transform="translate(191.375, 50)">
    <g shape-rendering="crispEdges">
      <rect width="57" height="20" fill="#1572b6"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
      <image x="5" y="3" width="14" height="14" href="data:image/svg+xml;base64,"/>
      <text x="375" y="140" textLength="290" transform="scale(.1)">CSS3</text>
    </g>
  </g>
</svg>
